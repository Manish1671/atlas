name: Atlas CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -f docker/api.Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:latest .
      - run: docker build -f docker/web.Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/atlas-web:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/atlas-web:latest .
      - run: docker push --all-tags ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api && docker push --all-tags ${{ secrets.DOCKERHUB_USERNAME }}/atlas-web
  trivy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/atlas-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
  deploy:
    needs: [docker, trivy]
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
